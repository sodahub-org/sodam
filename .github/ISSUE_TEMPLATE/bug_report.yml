name: Bug 报告
description: 功能不正常、崩溃、界面/播放异常
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！提交前请先搜一下已有 issue，避免重复。
        **请勿粘贴 Cookie、签名 Token、抓包签名头或设备指纹** —— 这些属于账号凭据。

  - type: textarea
    id: what
    attributes:
      label: 问题描述
      description: 发生了什么？和预期有什么差别？
      placeholder: 例如：播放无损时切歌，进度条回到 0 但声音还是上一首
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: 运行环境
      options:
        - Linux（Wayland）
        - Linux（X11）
        - macOS（Apple Silicon）
        - Windows（x64）
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: 系统版本
      placeholder: 例如：Arch Linux / Hyprland 0.56.2、macOS 15.1、Windows 11 24H2
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: SodaM 版本
      description: 设置页底部 / Release 页都能看到；用 `pacman -Q sodam` 或 `sodam` 安装包名都行
      placeholder: 例如：0.3.1
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开「搜索」
        2. 输入 xxx
        3. 点 xxx
        4. 出现 xxx
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望行为
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: 日志 / 截图 / 录屏
      description: |
        终端启动时能看到日志：`RUST_BACKTRACE=1 sodam`（Linux/macOS）或 PowerShell 里运行安装目录下的 `sodam.exe`。
        界面问题请附截图；崩溃请附 backtrace。
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: 确认
      options:
        - label: 已经升级到最新版本并复现过
          required: true
        - label: 搜索过已有 issue，没有重复
          required: true
        - label: 内容里不含 Cookie / Token / 设备指纹等凭据
          required: true
