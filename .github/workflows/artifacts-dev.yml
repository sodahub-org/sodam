name: Dev artifacts

# 临时工作流：给未合并分支构建可安装产物供人工验收（只上传 artifact，不发布）。
# 合并 PR 前必须删除本文件。

on:
  workflow_dispatch:
  push:
    branches:
      - 'agent/**'

concurrency:
  group: artifacts-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-installer:
    name: Windows x64 installer
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      # Windows runner 自带 VS Build Tools；托盘（tray-icon）与 DirectX 后端无需额外系统依赖。
      - uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --release --locked --workspace

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
        shell: pwsh

      - name: Create Windows installer
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"' |
            Select-Object -First 1).Matches.Groups[1].Value
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$version" `
            packaging/windows/sodam.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $setup = "release/sodam-$version-windows-x64-setup.exe"
          if (-not (Test-Path $setup)) { throw "installer not found: $setup" }
          $hash = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLower()
          "$hash  $(Split-Path $setup -Leaf)" | Out-File -FilePath "$setup.sha256" -Encoding ascii

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: sodam-windows-x64-dev
          path: release/*
          if-no-files-found: error
          retention-days: 7

  linux-x64:
    name: Linux x86_64 packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config git \
            libasound2-dev libdbus-1-dev libfontconfig1-dev \
            libfreetype-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libxcb1-dev

      - uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --release --locked --workspace

      - name: Create pacman package
        run: |
          package=$(packaging/make-linux-package.sh 'x86_64')
          test -s "$package"
          mkdir -p release
          mv "$package" "$package.sha256" release/

      - name: Create Debian package
        run: |
          package=$(packaging/deb/make-deb.sh 'x86_64')
          test -s "$package"
          mkdir -p release
          mv "$package" "$package.sha256" release/

      - name: Upload packages artifact
        uses: actions/upload-artifact@v4
        with:
          name: sodam-linux-x64-dev
          path: release/*
          if-no-files-found: error
          retention-days: 7
