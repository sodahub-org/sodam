[workspace]
resolver = "2"
members = ["crates/sodam", "crates/sodam-core"]

[workspace.package]
version = "0.3.9"
edition = "2021"
rust-version = "1.85"
license = "AGPL-3.0-or-later"
repository = "https://github.com/sodahub-org/sodam"
authors = ["sodahub-org"]

[workspace.dependencies]
# sodahub-org/gpui：fork 自 sonorahq/gpui（Zed gpui 新代码库），
# sonora 的丝滑滚动（Glide + Scroller + 自绘滚动条）就建立在它之上。
gpui = { git = "https://github.com/sodahub-org/gpui", rev = "311b915", default-features = false, features = ["font-kit", "wayland", "x11"] }
gpui_platform = { git = "https://github.com/sodahub-org/gpui", rev = "311b915", features = ["font-kit", "wayland", "x11"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
sys-locale = "0.3"
dirs = "6"
ureq = { version = "2.12", default-features = false, features = ["tls", "gzip"] }

libresoda = { git = "https://github.com/sodahub-org/libresoda.git", rev = "32fe0f9" }
