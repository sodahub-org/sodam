[package]
name = "sodam"
description = "SodaM —— 基于 GPUI + libresoda 的原生汽水音乐客户端"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "sodam"
path = "src/main.rs"

[dependencies]
sodam-core = { path = "../sodam-core" }
anyhow.workspace = true
sys-locale.workspace = true
gpui.workspace = true
gpui_platform.workspace = true
image = { version = "0.25", default-features = false, features = ["png"] }

# StatusNotifier 托盘是 Linux 桌面协议，macOS 上没有 D-Bus session bus。
[target.'cfg(target_os = "linux")'.dependencies]
ksni = "0.2"

# macOS / Windows 共用 tray-icon：macOS 走 NSStatusItem，Windows 走 shell 通知区域。
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
tray-icon = "0.25"

# Windows：启用 gpui 的 manifest 资源（PerMonitorV2 DPI / Win10 声明 / SegmentHeap）。
[target.'cfg(target_os = "windows")'.dependencies]
gpui = { workspace = true, features = ["windows-manifest"] }

# 把应用图标嵌入 sodam.exe（快捷方式 / 资源管理器显示）。
[build-dependencies]
winresource = "0.1"
