[package]
name = "sodam"
description = "SodaM —— 基于 GPUI + libresoda 的原生汽水音乐客户端"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "sodam"
path = "src/main.rs"

[dependencies]
sodam-core = { path = "../sodam-core" }
anyhow.workspace = true
sys-locale.workspace = true
gpui.workspace = true
gpui_platform.workspace = true
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
unicode-segmentation = "1.13.3"
# 封面需求队列：渲染提交需求，消费循环按需唤醒。
futures-channel.workspace = true
# 组合两路 future：定时器/唤醒通道取先到的（app.rs），zip 并行等待（media/mpris.rs）。
futures-lite.workspace = true

# StatusNotifier 托盘是 Linux 桌面协议，macOS 上没有 D-Bus session bus。
[target.'cfg(target_os = "linux")'.dependencies]
ksni = "0.2"
# 系统媒体控制：MPRIS（playerctl / 桌面挂件 / 合成器绑的媒体键）。
mpris-server = "0.10"
tokio = { version = "1", features = ["sync"] }

# macOS / Windows 共用 tray-icon：macOS 走 NSStatusItem，Windows 走 shell 通知区域。
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
tray-icon = "0.25"
# 系统媒体控制：macOS 的 Now Playing 中心 / Windows 的 SMTC 传输控件。
souvlaki = "0.8"

# Windows：启用 gpui 的 manifest 资源（PerMonitorV2 DPI / Win10 声明 / SegmentHeap）。
[target.'cfg(target_os = "windows")'.dependencies]
gpui = { workspace = true, features = ["windows-manifest"] }
# SMTC 要挂在窗口上，需要从 gpui 的 Window 上取原生 HWND。
raw-window-handle = "0.6"

# 测试里真跑 GPUI 实体：TestAppContext / #[gpui::test] 都在这个 feature 后面。
# 只进测试构建，产品二进制不会带上 test-support。同一 crate 的 features 在各
# 依赖段是并集（本仓库 workspace 用 resolver = "2"）：普通构建仍是
# font-kit / wayland / x11，谁改 resolver 要回头看这条注释。
[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }

# 把应用图标嵌入 sodam.exe（快捷方式 / 资源管理器显示）。
[build-dependencies]
winresource = "0.1"
